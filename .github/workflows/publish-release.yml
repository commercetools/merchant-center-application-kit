name: Publish Release
# Reusable workflow that handles official releases:
# - Versions packages using changesets and publishes to npm
# - Creates GitHub releases
# - Publishes canary releases if no official release was created
# - Builds playground application
# - Publishes preview releases from PR branches when called with `mode: preview`
#
# Previews live in this file on purpose. npm trusted publishing is configured
# per workflow file, and official releases already publish from here, so a
# preview publish from another file may not match that configuration.

on:
  workflow_call:
    inputs:
      mode:
        description: "`release` (default) for official releases, `preview` for PR preview publishes"
        type: string
        default: release

jobs:
  publish-release:
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      # Get GitHub token via the CT Changesets App
      - name: Generate GitHub token (via CT Changesets App)
        id: generate_github_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CT_CHANGESETS_APP_ID }}
          private-key: ${{ secrets.CT_CHANGESETS_APP_PEM }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Pass a personal access token (using our `ct-changesets` app) to be able to trigger other workflows

          # https://help.github.com/en/actions/reference/events-that-trigger-workflows#triggering-new-workflows-using-a-personal-access-token
          # https://github.community/t/action-does-not-trigger-another-on-push-tag-action/17148/8
          token: ${{ steps.generate_github_token.outputs.token }}

      # Ensure we are using valid node version for npm trusted publising AFTER checkout
      # https://docs.npmjs.com/trusted-publishers#github-actions-configuration
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"

      # Ensure npm >=11.5.1 for OIDC support (npm@12 has a broken sigstore dependency)
      - name: Update npm
        run: npm install -g npm@11

      - name: Verify npm version
        run: npm --version

      - name: Installing dependencies and building packages
        uses: ./.github/actions/ci

      # Configure npm registry for trusted publishing (OIDC)
      # This must run AFTER the CI action to override the Node setup with registry config
      # https://docs.npmjs.com/trusted-publishers#github-actions-configuration
      - name: Setup npm registry for publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"

      - name: Storing release version for changeset
        id: release_version
        run: echo "VALUE=$(./scripts/print_release_version.sh)" >> $GITHUB_OUTPUT
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.generate_github_token.outputs.token }}

      - name: Creating release pull request or publishing release to npm registry
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
          version: pnpm changeset:version-and-format
          commit: "ci(changesets): version packages"
          createGithubReleases: false
          commitMode: "github-api"
        env:
          GITHUB_TOKEN: ${{ steps.generate_github_token.outputs.token }}
          SKIP_POSTINSTALL_DEV_SETUP: true

      - name: Create aggregate GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.generate_github_token.outputs.token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.VALUE }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: ./scripts/create-aggregate-github-release.sh

      # Publish canary releases only if the packages weren't published already
      - name: Publishing canary releases to npm registry
        if: steps.changesets.outputs.published != 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          pnpm changeset version --snapshot canary
          pnpm changeset publish --tag canary
        env:
          GITHUB_TOKEN: ${{ steps.generate_github_token.outputs.token }}
          # Versioning re-runs the install, whose postinstall would flip the
          # built package output back to `preconstruct dev` stubs.
          SKIP_POSTINSTALL_DEV_SETUP: true

      - name: Building Playground application
        if: steps.changesets.outputs.published != 'true' && github.ref == 'refs/heads/main'
        run: pnpm playground:build
        env:
          APP_ID: ${{ secrets.APP_ID_PLAYGROUND }}
          MC_API_URL: ${{ secrets.MC_API_URL }}
          CTP_INITIAL_PROJECT_KEY: ${{ secrets.CYPRESS_PROJECT_KEY }}
          HOST_GCP_STAGING: ${{ secrets.HOST_GCP_STAGING }}

  publish-preview:
    if: inputs.mode == 'preview'
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      # Get GitHub token via the CT Changesets App
      - name: Generate GitHub token (via CT Changesets App)
        id: generate_github_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.CT_CHANGESETS_APP_ID }}
          private_key: ${{ secrets.CT_CHANGESETS_APP_PEM }}

      - name: Get PR branch
        id: pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const branch = pr.data.head.ref;
            const sanitized = branch.replace(/[^a-zA-Z0-9-]/g, '-').slice(0, 40);
            core.setOutput('ref', branch);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('tag', sanitized);

      - name: React to comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.pr.outputs.ref }}
          token: ${{ steps.generate_github_token.outputs.token }}

      # Ensure we are using valid node version for npm trusted publishing AFTER checkout
      # https://docs.npmjs.com/trusted-publishers#github-actions-configuration
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"

      # Ensure npm >=11.5.1 for OIDC support (npm@12 has a broken sigstore dependency)
      - name: Update npm
        run: npm install -g npm@11

      - name: Verify npm version
        run: npm --version

      - name: Installing dependencies and building packages
        uses: ./.github/actions/ci

      # Configure npm registry for trusted publishing (OIDC)
      # This must run AFTER the CI action to override the Node setup with registry config
      # https://docs.npmjs.com/trusted-publishers#github-actions-configuration
      - name: Setup npm registry for publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"

      # Publish logic lives in scripts/preview-publish.sh (not inline) so
      # that changes are picked up from the checked-out PR branch.  GitHub
      # resolves issue_comment-triggered workflow YAML from the default
      # branch, but scripts come from the checkout.
      - name: Publishing preview releases to npm registry
        id: publish
        run: ./scripts/preview-publish.sh
        env:
          GITHUB_TOKEN: ${{ steps.generate_github_token.outputs.token }}
          BRANCH_NAME: ${{ steps.pr.outputs.ref }}

      - name: Comment with install instructions
        if: success()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const version = '${{ steps.publish.outputs.version }}';
            const sha = '${{ steps.pr.outputs.sha }}'.slice(0, 7);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `### 🚀 Preview published`,
                '',
                `**Version:** \`${version}\``,
                `**Commit:** \`${sha}\``,
                '',
                '```bash',
                `pnpm add @commercetools-frontend/application-shell@${version}`,
                `pnpm add @commercetools-frontend/mc-scripts@${version}`,
                '```',
              ].join('\n'),
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### ❌ Preview publish failed\n\nSee details: [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            });

  # TEMPORARY: asks npm whether it accepts this run's OIDC identity.
  oidc-probe:
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: ./scripts/oidc-probe.sh
